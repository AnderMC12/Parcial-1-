<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalle del país — Explorer App</title>
    <meta name="description" content="Ficha con capital, región, población, idiomas y moneda." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#edf7d2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://restcountries.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/detalle-DhANrFm7.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/icons-mount-BEkM_R_D.js">
    <link rel="modulepreload" crossorigin href="./assets/format-ks33K8dX.js">
    <link rel="stylesheet" crossorigin href="./assets/icons-mount-CKkABIme.css">
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="border-b border-border-strong bg-surface">
      <div class="app-shell flex h-14 items-center justify-between gap-md tablet:h-16">
        <a href="./index.html" class="text-subtitle text-text-primary no-underline"
          >Explorer App</a
        >
        <nav aria-label="Navegación principal">
          <ul class="flex items-center gap-xs">
            <li>
              <a class="btn btn-quiet text-label" href="./design-system.html">Design System</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="contenido" class="app-shell py-lg tablet:py-xl">
      <nav aria-label="Ruta de navegación" class="mb-md">
        <a
          class="inline-flex items-center gap-xs text-body text-text-primary no-underline"
          href="./index.html"
        >
          <span data-icon="arrow-left"></span> Volver al listado
        </a>
      </nav>

      <!-- Contenedor de los estados de carga, error y país inexistente. -->
      <div id="detail-status" role="status" aria-live="polite"></div>

      <div
        id="detail"
        hidden
        class="desktop:grid desktop:grid-cols-[minmax(0,420px)_1fr] desktop:gap-xl"
      >
        <div>
          <img
            id="country-flag"
            src=""
            alt=""
            class="aspect-[3/2] w-full rounded-card border border-border-strong bg-surface-raised object-cover shadow-raised"
          />
          <h1 id="country-name" class="mt-md break-words text-title text-text-primary"></h1>
        </div>

        <div class="mt-lg desktop:mt-0">
          <section
            class="rounded-card border border-border-strong bg-surface px-md pb-md pt-lg shadow-card"
            aria-labelledby="info-general"
          >
            <h2 id="info-general" class="text-card text-text-primary">Información general</h2>

            <dl class="mt-sm">
              <div class="stat-row">
                <dt class="text-text-secondary">Capital</dt>
                <dd id="stat-capital" class="break-words text-right text-text-primary"></dd>
              </div>
              <div class="stat-row">
                <dt class="text-text-secondary">Región</dt>
                <dd id="stat-region" class="break-words text-right text-text-primary"></dd>
              </div>
              <div class="stat-row">
                <dt class="text-text-secondary">Población</dt>
                <dd id="stat-population" class="text-right text-text-primary"></dd>
              </div>
              <div class="stat-row">
                <dt><span class="badge">Idiomas</span></dt>
                <dd id="stat-languages" class="break-words text-right text-text-primary"></dd>
              </div>
              <div class="stat-row">
                <dt><span class="badge">Moneda</span></dt>
                <dd id="stat-currency" class="break-words text-right text-text-primary"></dd>
              </div>
            </dl>
          </section>

          <section id="borders-section" class="mt-lg" aria-labelledby="fronteras">
            <h2 id="fronteras" class="text-card text-text-primary">Países fronterizos</h2>
            <ul id="borders-list" class="mt-md flex flex-wrap gap-sm"></ul>
          </section>
        </div>
      </div>
    </main>

    <footer class="app-shell border-t border-border pb-xl pt-lg text-label text-text-secondary">
      <p>
        Proyecto académico — Diseño Web Adaptable, UNIVO. Datos obtenidos de
        REST Countries.
      </p>
    </footer>

  </body>
</html>
