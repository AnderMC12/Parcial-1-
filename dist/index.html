<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explorer App — Países del mundo</title>
    <meta
      name="description"
      content="Explorer App: consulta la bandera, la población, la región y la capital de cada país. Búsqueda por nombre y filtro por región."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#edf7d2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://restcountries.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-BpwyTksy.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/icons-mount-BEkM_R_D.js">
    <link rel="modulepreload" crossorigin href="./assets/format-ks33K8dX.js">
    <link rel="stylesheet" crossorigin href="./assets/icons-mount-CKkABIme.css">
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="border-b border-border-strong bg-surface">
      <div class="app-shell flex h-14 items-center justify-between gap-md tablet:h-16">
        <a
          href="./index.html"
          class="text-subtitle text-text-primary no-underline"
          aria-current="page"
          >Explorer App</a
        >
        <nav aria-label="Navegación principal">
          <ul class="flex items-center gap-xs">
            <li>
              <a class="btn btn-quiet text-label" href="./design-system.html">Design System</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="contenido" class="app-shell py-lg tablet:py-xl">
      <h1 class="text-title text-text-primary">Países del mundo</h1>
      <p class="mt-xs max-w-reading text-body text-text-secondary">
        Busca por nombre o filtra por región para ver la bandera, la población y
        la capital de cada país.
      </p>

      <!-- La búsqueda y el filtro actúan sobre los datos ya cargados en
           memoria: el formulario no navega a ninguna parte. -->
      <form
        id="search-form"
        class="mt-lg grid gap-sm tablet:grid-cols-[1fr_260px] tablet:items-center"
        role="search"
      >
        <div class="field">
          <span class="shrink-0 text-text-secondary" data-icon="search"></span>
          <label class="sr-only" for="q">Buscar país por nombre</label>
          <input
            id="q"
            name="q"
            type="search"
            class="min-w-0 flex-1 bg-transparent text-card text-text-primary outline-none placeholder:text-text-secondary"
            placeholder="Buscar país…"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button
            type="button"
            data-clear
            class="grid size-6 shrink-0 place-items-center rounded-pill text-text-secondary"
            hidden
          >
            <span class="sr-only">Borrar la búsqueda</span>
            <span data-icon="x-circle"></span>
          </button>
        </div>

        <div class="field">
          <label class="sr-only" for="region">Filtrar por región</label>
          <select
            id="region"
            name="region"
            class="min-w-0 flex-1 appearance-none bg-transparent text-card text-text-primary outline-none"
          >
            <option value="">Todas las regiones</option>
          </select>
          <span
            class="pointer-events-none shrink-0 text-text-secondary"
            data-icon="chevron-down"
          ></span>
        </div>
      </form>

      <!-- Región viva: anuncia el conteo, el estado de carga y el de error. -->
      <p
        id="results-count"
        class="mt-lg text-label text-text-secondary"
        role="status"
        aria-live="polite"
      >
        Cargando países…
      </p>

      <ul id="results-list" class="mt-md grid gap-md tablet:grid-cols-2 desktop:grid-cols-3"></ul>
    </main>

    <footer class="app-shell border-t border-border pb-xl pt-lg text-label text-text-secondary">
      <p>
        Proyecto académico — Diseño Web Adaptable, UNIVO. Datos obtenidos de
        REST Countries.
      </p>
    </footer>

  </body>
</html>
